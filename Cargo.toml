[package]
name = "night-crawler"
version = "0.1.0"
edition = "2021"
description = "Night Crawler — AI-assisted automated reconnaissance framework (port scan, service/version detection, DNS/AXFR, subdomains, directories, SNMP/LDAP/SMB enum, dorking, link analysis)"
license = "MIT"

[[bin]]
name = "night-crawler"
path = "src/main.rs"

[profile.release]
lto = true
strip = true

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "http2", "socks"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
hickory-proto = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
percent-encoding = "2"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1"
x509-parser = "0.16"
